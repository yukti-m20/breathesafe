server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support client-side single page app routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api requests to collector service if in docker compose
    location /api/ {
        proxy_pass http://collector:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket /ws to collector service
    location /ws {
        proxy_pass http://collector:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
